<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-label="StackRadar animated radar sweep">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ee2a8" stop-opacity=".5"/><stop offset="1" stop-color="#7ee2a8" stop-opacity="0"/></linearGradient></defs>
<style>.ring{fill:none;stroke:#203a43;stroke-width:1.2} .sw{transform-origin:220px 160px;animation:spin 4s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
.bt{font:12px ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace;fill:#c9d1d9} .t{font:600 14px ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace;fill:#7ee2a8} .m{font:11px ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace;fill:#8b949e}
.pg{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite} @keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}} .b0{opacity:.15;animation:b0 4s linear infinite} @keyframes b0{0%,10.6%{opacity:.15}11.1%{opacity:1}56.1%{opacity:.35}100%{opacity:.15}} .b1{opacity:.15;animation:b1 4s linear infinite} @keyframes b1{0%,32.8%{opacity:.15}33.3%{opacity:1}78.3%{opacity:.35}100%{opacity:.15}} .b2{opacity:.15;animation:b2 4s linear infinite} @keyframes b2{0%,55.1%{opacity:.15}55.6%{opacity:1}99.0%{opacity:.35}100%{opacity:.15}} .b3{opacity:.15;animation:b3 4s linear infinite} @keyframes b3{0%,73.1%{opacity:.15}73.6%{opacity:1}99.0%{opacity:.35}100%{opacity:.15}} .b4{opacity:.15;animation:b4 4s linear infinite} @keyframes b4{0%,88.4%{opacity:.15}88.9%{opacity:1}99.0%{opacity:.35}100%{opacity:.15}} .b5{opacity:.15;animation:b5 4s linear infinite} @keyframes b5{0%,43.9%{opacity:.15}44.4%{opacity:1}89.4%{opacity:.35}100%{opacity:.15}}</style>
